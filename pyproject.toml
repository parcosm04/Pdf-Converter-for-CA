[project]
name = "pdf-converter-backend"
version = "0.1.0"
description = "FastAPI backend for Universal Bank Statement Parser"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pg8000>=1.30.0",
    "alembic>=1.13.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pdfplumber>=0.10.4",

    "openpyxl>=3.1.2",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "rapidfuzz>=3.6.0",
    "pytest>=8.0.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
