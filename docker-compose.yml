version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: ubsp_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubsp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ubsp_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubsp_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ubsp
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=SUPER_SECRET_JWT_KEY_MINIMUM_32_CHARACTERS_LONG_FOR_HMAC_SHA256
    ports:
      - "8000:8000"
    volumes:
      - shared_storage:/workspace/storage
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubsp_celery_worker
    restart: always
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ubsp
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=SUPER_SECRET_JWT_KEY_MINIMUM_32_CHARACTERS_LONG_FOR_HMAC_SHA256
    volumes:
      - shared_storage:/workspace/storage
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ubsp_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

volumes:
  postgres_data:
  shared_storage:
